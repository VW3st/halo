<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>HALO · voice console</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22><circle cx=%228%22 cy=%228%22 r=%226%22 fill=%22none%22 stroke=%22%2300d4ff%22 stroke-width=%222%22/></svg>" />
<style>
:root {
  --bg-0: #07090c;
  --bg-1: #0b0f15;
  --bg-2: #11161f;
  --bg-3: #18202d;
  --line: #1f2a3a;
  --line-soft: #141c28;
  --text: #d9e3f1;
  --text-dim: #6b7a90;
  --text-faint: #3e4a5f;
  --accent: #00d4ff;
  --accent-dim: #007999;
  --warn: #ffb547;
  --bad: #ff5d6c;
  --good: #6ee7b7;
  --purple: #b794f4;
  --font-ui: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", "Fira Code", ui-monospace, SFMono-Regular, Consolas, monospace;
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg-0);
  color: var(--text);
  font-family: var(--font-ui);
  font-size: 14px;
  line-height: 1.45;
  overflow: hidden;
}

/* radial accent glow behind the whole UI */
body::before {
  content: "";
  position: fixed;
  inset: -20% -20% auto auto;
  width: 60%; height: 60%;
  background: radial-gradient(circle at 70% 30%, rgba(0, 212, 255, 0.06), transparent 60%);
  pointer-events: none;
  z-index: 0;
}

.app {
  position: relative; z-index: 1;
  display: grid;
  grid-template-rows: auto auto 1fr;
  height: 100vh;
  padding: 14px 18px;
  gap: 12px;
}

/* ---------- HEADER ---------- */
.hdr {
  display: flex; align-items: center; justify-content: space-between;
  border-bottom: 1px solid var(--line-soft);
  padding-bottom: 12px;
}
.hdr-left { display: flex; align-items: center; gap: 14px; }
.brand {
  font-family: var(--font-mono);
  font-size: 18px;
  letter-spacing: 0.4em;
  font-weight: 700;
  color: var(--text);
  display: flex; align-items: center; gap: 10px;
}
.brand .dot {
  width: 9px; height: 9px; border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 12px var(--accent);
  animation: pulse 2.4s ease-in-out infinite;
}
@keyframes pulse {
  0%, 100% { opacity: 0.55; transform: scale(0.9); }
  50%      { opacity: 1; transform: scale(1.05); }
}
.mode-pill {
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--text-dim);
  padding: 5px 10px;
  border: 1px solid var(--line);
  border-radius: 99px;
}
.mode-pill.local   { color: var(--text-dim); }
.mode-pill.direct  { color: var(--accent); border-color: rgba(0, 212, 255, 0.45); }
.hdr-right {
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.1em;
  color: var(--text-faint);
}
.hdr-right .v { color: var(--text-dim); }

/* ---------- PIPELINE ---------- */
.pipeline {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 8px;
  padding: 10px 0 4px;
}
.stage {
  background: var(--bg-1);
  border: 1px solid var(--line-soft);
  border-radius: 6px;
  padding: 10px 12px;
  position: relative;
  transition: border-color .25s, box-shadow .25s, background .25s;
}
.stage .label {
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--text-faint);
}
.stage .val {
  font-family: var(--font-mono);
  font-size: 13px;
  color: var(--text-dim);
  margin-top: 4px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.stage.active {
  background: var(--bg-2);
  border-color: rgba(0, 212, 255, 0.55);
  box-shadow: 0 0 0 1px rgba(0, 212, 255, 0.15), 0 0 24px rgba(0, 212, 255, 0.08);
}
.stage.active .label { color: var(--accent); }
.stage.active .val   { color: var(--text); }
.stage.done {
  border-color: var(--line);
}
.stage.done .val { color: var(--text); }

/* ---------- MAIN GRID ---------- */
.main {
  display: grid;
  grid-template-columns: 1fr 380px;
  grid-template-rows: 1fr auto;
  gap: 12px;
  min-height: 0;
}

.transcript {
  background: var(--bg-1);
  border: 1px solid var(--line-soft);
  border-radius: 8px;
  padding: 22px 26px;
  display: flex; flex-direction: column;
  min-height: 0;
  overflow: hidden;
}
.transcript .panel-title {
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--text-faint);
  margin-bottom: 14px;
}
.transcript .you {
  font-family: var(--font-mono);
  font-size: 22px;
  line-height: 1.45;
  color: var(--text);
  font-weight: 400;
  letter-spacing: -0.005em;
  white-space: pre-wrap;
  flex: 1;
  overflow-y: auto;
}
.transcript .you.empty { color: var(--text-faint); font-style: italic; }
.transcript .speaking {
  margin-top: 16px;
  padding-top: 14px;
  border-top: 1px solid var(--line-soft);
  font-family: var(--font-mono);
  font-size: 13px;
  color: var(--text-dim);
  min-height: 32px;
  display: flex; align-items: center; gap: 10px;
}
.transcript .speaking .ico {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--good);
  box-shadow: 0 0 8px var(--good);
  flex-shrink: 0;
  animation: pulse 1.1s ease-in-out infinite;
}
.transcript .speaking .who { color: var(--good); }
.transcript .speaking.idle .ico { background: var(--text-faint); box-shadow: none; animation: none; }
.transcript .speaking.idle .who { color: var(--text-faint); }
.transcript .speaking.idle .what { color: var(--text-faint); }

.jobs {
  background: var(--bg-1);
  border: 1px solid var(--line-soft);
  border-radius: 8px;
  padding: 18px 16px;
  display: flex; flex-direction: column;
  min-height: 0;
  overflow: hidden;
}
.jobs .panel-title {
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--text-faint);
  margin-bottom: 14px;
  display: flex; justify-content: space-between; align-items: center;
}
.jobs .panel-title .count {
  background: var(--bg-3);
  color: var(--text-dim);
  padding: 2px 8px;
  border-radius: 99px;
  font-size: 10px;
  letter-spacing: 0.1em;
}
.jobs ul { list-style: none; padding: 0; margin: 0; flex: 1; overflow-y: auto; }
.jobs li {
  padding: 11px 12px;
  border-radius: 6px;
  border: 1px solid var(--line-soft);
  margin-bottom: 8px;
  background: var(--bg-2);
}
.jobs li.running {
  border-color: rgba(0, 212, 255, 0.4);
  box-shadow: 0 0 0 1px rgba(0, 212, 255, 0.1);
}
.jobs li.idle { opacity: 0.55; }
.jobs .row {
  display: flex; justify-content: space-between; align-items: baseline;
  gap: 8px;
}
.jobs .name {
  font-family: var(--font-mono);
  font-weight: 600;
  font-size: 13px;
  color: var(--text);
}
.jobs li.running .name { color: var(--accent); }
.jobs li.idle .name { color: var(--text-dim); }
.jobs .agent {
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.1em;
  color: var(--text-faint);
}
.jobs .state {
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}
.jobs li.running .state { color: var(--accent); }
.jobs li.idle .state { color: var(--text-faint); }
.jobs li.done .state { color: var(--good); }
.jobs .prompt {
  margin-top: 6px;
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--text-dim);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}

.log {
  grid-column: 1 / -1;
  background: var(--bg-1);
  border: 1px solid var(--line-soft);
  border-radius: 8px;
  padding: 12px 16px;
  height: 220px;
  display: flex; flex-direction: column;
  min-height: 0;
}
.log .panel-title {
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--text-faint);
  margin-bottom: 8px;
  display: flex; justify-content: space-between; align-items: center;
}
.log .panel-title .conn { font-size: 9px; letter-spacing: 0.15em; color: var(--good); }
.log .panel-title .conn.bad { color: var(--bad); }
.log .stream {
  flex: 1;
  overflow-y: auto;
  font-family: var(--font-mono);
  font-size: 12px;
  line-height: 1.55;
}
.log .row {
  display: grid;
  grid-template-columns: 76px 130px 1fr;
  gap: 12px;
  padding: 1px 0;
}
.log .ts   { color: var(--text-faint); }
.log .kind { color: var(--text-dim); }
.log .body { color: var(--text); white-space: pre-wrap; word-break: break-word; }
.log .row.k-wake .kind, .log .row.k-wake .body  { color: var(--accent); }
.log .row.k-stt  .kind, .log .row.k-stt  .body  { color: var(--purple); }
.log .row.k-route .kind, .log .row.k-route .body { color: var(--warn); }
.log .row.k-agent .kind, .log .row.k-agent .body { color: var(--good); }
.log .row.k-tts  .kind, .log .row.k-tts  .body  { color: var(--good); opacity: .85; }
.log .row.k-err  .kind, .log .row.k-err  .body  { color: var(--bad); }
.log .row.k-mode .kind, .log .row.k-mode .body  { color: var(--purple); }

/* scrollbars */
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: var(--bg-3); }
</style>
</head>
<body>
<div class="app">

  <header class="hdr">
    <div class="hdr-left">
      <div class="brand"><span class="dot"></span>HALO</div>
      <div id="mode-pill" class="mode-pill local">LOCAL</div>
      <div id="state-pill" class="mode-pill">listening</div>
    </div>
    <div class="hdr-right">
      <span id="conn-status">connecting…</span>
      <span class="v">  ·  v0.6</span>
    </div>
  </header>

  <nav class="pipeline">
    <div class="stage" id="s-wake"><div class="label">wake</div><div class="val">idle</div></div>
    <div class="stage" id="s-record"><div class="label">record</div><div class="val">idle</div></div>
    <div class="stage" id="s-stt"><div class="label">transcribe</div><div class="val">idle</div></div>
    <div class="stage" id="s-route"><div class="label">route</div><div class="val">idle</div></div>
    <div class="stage" id="s-agent"><div class="label">agent</div><div class="val">idle</div></div>
    <div class="stage" id="s-tts"><div class="label">voice</div><div class="val">idle</div></div>
  </nav>

  <section class="main">
    <div class="transcript">
      <div class="panel-title">transcript</div>
      <div id="transcript" class="you empty">(waiting for you to speak)</div>
      <div id="speaking" class="speaking idle">
        <span class="ico"></span>
        <span><span class="who">Halo</span> <span class="what">— silent</span></span>
      </div>
    </div>

    <aside class="jobs">
      <div class="panel-title">
        <span>agents</span>
        <span class="count" id="jobs-count">0 running</span>
      </div>
      <ul id="jobs-list"></ul>
    </aside>

    <div class="log">
      <div class="panel-title">
        <span>event log</span>
        <span class="conn" id="conn-pill">● LIVE</span>
      </div>
      <div id="log-stream" class="stream"></div>
    </div>
  </section>

</div>

<script>
(() => {
  // --- state ---------------------------------------------------------------
  let lastSeq = 0;
  let connected = false;
  const MAX_LOG_ROWS = 250;

  const $ = (id) => document.getElementById(id);
  const stageEls = {
    wake: $("s-wake"),
    record: $("s-record"),
    stt: $("s-stt"),
    route: $("s-route"),
    agent: $("s-agent"),
    tts: $("s-tts"),
  };
  const stageTimers = {};

  // --- helpers -------------------------------------------------------------
  const fmtTime = (ts) => {
    const d = new Date(ts * 1000);
    return d.toTimeString().slice(0, 8);
  };
  const setConn = (ok) => {
    connected = ok;
    $("conn-status").textContent = ok ? "live" : "disconnected";
    $("conn-pill").textContent = ok ? "● LIVE" : "● OFFLINE";
    $("conn-pill").classList.toggle("bad", !ok);
  };
  const setStage = (key, value, ttl = 1500) => {
    const el = stageEls[key];
    if (!el) return;
    el.classList.add("active");
    el.classList.remove("done");
    el.querySelector(".val").textContent = value;
    clearTimeout(stageTimers[key]);
    stageTimers[key] = setTimeout(() => {
      el.classList.remove("active");
      el.classList.add("done");
    }, ttl);
  };
  const setMode = (direct) => {
    const pill = $("mode-pill");
    if (direct) {
      pill.textContent = "DIRECT · " + direct.toUpperCase();
      pill.className = "mode-pill direct";
    } else {
      pill.textContent = "LOCAL";
      pill.className = "mode-pill local";
    }
  };
  const setStatePill = (text) => { $("state-pill").textContent = text; };
  const setTranscript = (text) => {
    const el = $("transcript");
    if (!text) {
      el.textContent = "(waiting for you to speak)";
      el.classList.add("empty");
    } else {
      el.textContent = text;
      el.classList.remove("empty");
    }
  };
  const setSpeaking = (who, what) => {
    const el = $("speaking");
    if (!who) {
      el.classList.add("idle");
      el.innerHTML = '<span class="ico"></span><span><span class="who">Halo</span> <span class="what">— silent</span></span>';
    } else {
      el.classList.remove("idle");
      el.innerHTML = `<span class="ico"></span><span><span class="who">${who}</span> <span class="what">— ${escape(what)}</span></span>`;
    }
  };
  const escape = (s) => String(s).replace(/[&<>"]/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  // --- log -----------------------------------------------------------------
  const logEl = $("log-stream");
  function pushLog(evt) {
    const row = document.createElement("div");
    const klass = ({
      "wake.heard": "k-wake", "wake.fired": "k-wake",
      "record.opened": "k-wake", "record.silence": "k-wake",
      "stt.done": "k-stt",
      "route.matched": "k-route",
      "agent.dispatched": "k-agent", "agent.streaming": "k-agent",
      "agent.done": "k-agent", "agent.error": "k-err",
      "tts.spoke": "k-tts",
      "mode.changed": "k-mode", "session.reset": "k-mode",
      "convo.entered": "k-mode", "convo.exited": "k-mode",
    })[evt.kind] || "";
    row.className = "row " + klass;
    row.innerHTML =
      `<div class="ts">${fmtTime(evt.ts)}</div>` +
      `<div class="kind">${evt.kind}</div>` +
      `<div class="body">${escape(formatBody(evt))}</div>`;
    logEl.appendChild(row);
    while (logEl.children.length > MAX_LOG_ROWS) logEl.removeChild(logEl.firstChild);
    logEl.scrollTop = logEl.scrollHeight;
  }
  function formatBody(evt) {
    const { seq, ts, kind, ...rest } = evt;
    if (Object.keys(rest).length === 0) return "";
    if ("text" in rest) return rest.text;
    if ("name" in rest && "sentence" in rest) return `${rest.name}: ${rest.sentence}`;
    if ("prompt" in rest) return rest.prompt;
    return JSON.stringify(rest);
  }

  // --- event handlers ------------------------------------------------------
  function apply(evt) {
    switch (evt.kind) {
      case "wake.heard":
        setStage("wake", `score ${(evt.score || 0).toFixed(2)}`, 800);
        break;
      case "wake.fired":
        setStage("wake", `fired ${(evt.score || 0).toFixed(2)}`, 1200);
        setStatePill("wake fired");
        break;
      case "convo.entered":
        setStatePill("in conversation");
        break;
      case "convo.exited":
        setStatePill("listening");
        setTranscript("");
        break;
      case "record.opened":
        setStage("record", "speak now", 2500);
        break;
      case "record.silence":
        setStage("record", "silence", 800);
        break;
      case "stt.done":
        setStage("stt", `${evt.ms || 0}ms`, 1200);
        setTranscript(evt.text || "");
        break;
      case "route.matched":
        setStage("route", evt.handler || "?", 1500);
        break;
      case "mode.changed":
        setMode(evt.direct || null);
        break;
      case "session.reset":
        // no-op visual but logged
        break;
      case "agent.dispatched":
        setStage("agent", `${evt.name || evt.agent} starting`, 3000);
        break;
      case "agent.streaming":
        setStage("agent", `${evt.name || evt.agent} streaming`, 3000);
        break;
      case "agent.done":
        setStage("agent", `${evt.name || evt.agent} done`, 1500);
        break;
      case "agent.error":
        setStage("agent", `error`, 2000);
        break;
      case "tts.spoke":
        setStage("tts", "speaking", 1500);
        setSpeaking(evt.who || "Halo", evt.text || "");
        setTimeout(() => setSpeaking(null, null), Math.max(1500, (evt.text || "").length * 60));
        break;
    }
    pushLog(evt);
  }

  // --- jobs panel ----------------------------------------------------------
  async function refreshState() {
    try {
      const r = await fetch("/api/state");
      if (!r.ok) return;
      const data = await r.json();
      const list = $("jobs-list");
      list.innerHTML = "";
      let running = 0;
      data.agents.forEach((a) => {
        const li = document.createElement("li");
        const state = a.job_running ? "running" : (a.session_active ? "ready" : "idle");
        li.className = state;
        if (a.job_running) running++;
        li.innerHTML = `
          <div class="row">
            <div>
              <span class="name">${escape(a.session_name)}</span>
              <span class="agent"> · ${escape(a.spoken_name.toLowerCase())}</span>
            </div>
            <div class="state">${state}${a.job_elapsed_sec != null ? " " + Math.round(a.job_elapsed_sec) + "s" : ""}</div>
          </div>
          ${a.job_prompt ? `<div class="prompt">${escape(a.job_prompt)}</div>` : ""}
        `;
        list.appendChild(li);
      });
      $("jobs-count").textContent = `${running} running`;
    } catch (e) { /* swallow */ }
  }

  // --- polling -------------------------------------------------------------
  async function pollEvents() {
    try {
      const r = await fetch("/api/events?since=" + lastSeq);
      if (!r.ok) throw new Error(r.status);
      const data = await r.json();
      setConn(true);
      data.events.forEach(apply);
      if (data.seq) lastSeq = data.seq;
    } catch (e) {
      setConn(false);
    }
  }

  setInterval(pollEvents, 250);
  setInterval(refreshState, 750);
  pollEvents();
  refreshState();
})();
</script>
</body>
</html>
