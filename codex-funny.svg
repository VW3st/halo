<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Claude Code shortcut chaos</title>
  <desc id="desc">A humorous programmer scene showing Claude Code keyboard shortcuts flying around a desk while the developer tries to operate a giant keyboard.</desc>
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7efe0"/>
      <stop offset="0.42" stop-color="#e6f0ec"/>
      <stop offset="1" stop-color="#d7e2f3"/>
    </linearGradient>
    <linearGradient id="desk" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6c4f36"/>
      <stop offset="0.5" stop-color="#9a7048"/>
      <stop offset="1" stop-color="#5b3f2b"/>
    </linearGradient>
    <linearGradient id="monitorGlass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f2b3a"/>
      <stop offset="1" stop-color="#0f1722"/>
    </linearGradient>
    <linearGradient id="terminalGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9ff7d2" stop-opacity="0.23"/>
      <stop offset="1" stop-color="#f6ce68" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="keyTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffdf8"/>
      <stop offset="1" stop-color="#d8d4cb"/>
    </linearGradient>
    <radialGradient id="panicGlow" cx="50%" cy="50%" r="65%">
      <stop offset="0" stop-color="#fff38f" stop-opacity="0.9"/>
      <stop offset="0.42" stop-color="#ff9d6c" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ff6b6b" stop-opacity="0"/>
    </radialGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#2a2118" flood-opacity="0.28"/>
    </filter>
    <filter id="tinyShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="2" flood-color="#2a2118" flood-opacity="0.25"/>
    </filter>
    <style>
      .label { font-family: Arial, Helvetica, sans-serif; font-weight: 700; fill: #24313f; }
      .small { font-family: Arial, Helvetica, sans-serif; font-size: 13px; fill: #d9ffe9; }
      .mono { font-family: Consolas, "Courier New", monospace; }
      .caption { font-family: Arial, Helvetica, sans-serif; font-weight: 800; fill: #17212b; }
      .scribble { fill: none; stroke: #4b6175; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

